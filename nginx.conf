# The SPA's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence: search engines index the error screen, uptime checks call it
# healthy, and a deploy that drops a route looks exactly like a deploy that did not. So the
# client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and the route table in src/lib/routes.ts must agree. That is one
# line per top-level route, paid once per route, in exchange for an honest status code on every
# wrong URL. test/routes.test.ts holds the two together.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is an http-context directive, which is why it sits ABOVE the server block rather than
# inside it — a conf.d file is included in http, so this is legal here and would not be legal ten
# lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui/surfaces, and test/sitemap.test.ts reads that
# export and fails when this alternation has drifted from it. They are the words that name an
# ENVIRONMENT rather than a surface: surfaces.ts reserves them so that no surface may take one as
# a subdomain, and deploy/scripts/check-apex-prefix.py enforces that from the other side.
#
# A testnet estate runs a testnet Aetherholm: test seasons, seeded islands, battles resolved
# against a database somebody is free to wipe. Every page of it competing with the real game in a
# search index is a support problem before it is an SEO one — a player who lands on a sealed
# chronicle from testnet is reading a history that never happened, and nothing on the page says
# so. So a non-mainnet environment answers `Disallow: /` and serves no sitemap at all.
#
# `(?:[^.]+-)?` catches BOTH shapes, and both still resolve. The environment is a SUFFIX on the
# first label now (`aetherholm-testnet.<apex>`) and was an apex prefix before (`testnet.<apex>`,
# which put this surface at the two-label `aetherholm.testnet.<apex>` — unreachable, because
# Cloudflare's Universal SSL is a one-label wildcard and every two-label name fails the handshake
# at the edge). surfaces.ts keeps the old shape deliberately, so a pattern matching only one of
# them would leave half the estate indexable on testnet.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # ────────────────────────────────────────────────────────────────────────────────────────────
    # THESE ARE REPEATED IN EVERY `location` BELOW THAT SETS ANY HEADER OF ITS OWN, AND THAT IS
    # NOT REDUNDANCY. nginx's `add_header` inheritance is ALL OR NOTHING PER LEVEL: a location
    # containing even one `add_header` discards every `add_header` from the enclosing block, so a
    # location that adds a Cache-Control silently drops all three of these. The web template's own
    # config has exactly this bug and serves every hashed asset with no nosniff header — measured
    # against a running image by the sibling that found it, not reasoned about.
    # ────────────────────────────────────────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /worlds/aetherholm/assets/ {
        try_files $uri =404;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- the generated art ------------------------------------------------
    # 22 MB of FLUX 2 Pro imagery: island archetypes, building sprites, airship profiles, the
    # interface glyphs, the splashes and the title lockup. Vite copies public/ into dist/
    # verbatim, so these are served as themselves rather than hashed into the bundle — which is
    # what makes them immutable-cacheable and what lets src/art/catalogue.ts name them by a stable
    # path.
    #
    # Immutable for a stronger reason than the hashed bundle's: these files are content-addressed
    # by what they ARE — the picture of a skyhall is that picture — so changing one is changing
    # the asset set, which ships as a new image.
    #
    # A MISSING ONE MUST 404 ON ITS OWN TERMS. Without this block a request for a picture that is
    # not there falls to `error_page 404 /index.html` and comes back as the app shell with a 200:
    # the <img> then fails to decode with no status to explain it, and — worse — anything probing
    # the URL is told the file is fine. That is the shape of the defect this whole change exists
    # to close (micro-org#175, #173).
    #
    # A prefix location rather than an alternation, deliberately: the ONE regex `location ~ ^/(…)`
    # block below is the enumerated route list and test/routes.test.ts finds it by that shape. A
    # second regex would be matched first and the route check would then be reading the wrong list
    # — and passing.
    location /worlds/aetherholm/art/ {
        try_files $uri =404;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    #
    # THE HEADER HAS TO BE REPEATED ON EVERY LOCATION THAT SERVES IT: `location = /index.html`
    # only matches a request for that literal path, while `location = /` and the enumerated route
    # block below serve the same file through `try_files` WITHOUT re-entering this block.
    location = /worlds/aetherholm/index.html {
        add_header Cache-Control "no-store" always;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts, which is also what the router and the
    # navigation are built from. test/routes.test.ts checks all three against each other, because
    # a route added to the router and not here works perfectly under `pnpm dev` and 404s on the
    # first hard refresh in production — a failure nothing about the diff looks like.
    # BOTH SPELLINGS. `/worlds/aetherholm/` is an address this surface did not used to have: the 301
    # from the retired hostname lands on it, and so does any link carrying a trailing slash.
    location = /worlds/aetherholm/ {
        add_header Cache-Control "no-store" always;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /worlds/aetherholm/index.html =404;
    }

    location = /worlds/aetherholm {
        add_header Cache-Control "no-store" always;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /worlds/aetherholm/index.html =404;
    }

    # `/?$`, NOT `(/|$)`. The second is a PREFIX: /battles/<id>, /cities/isl-1 and every other
    # address beneath an owned route were served the shell with a 200 while React rendered the
    # not-found page inside them. No route in this client takes a parameter — a battle is opened by
    # a query string, deliberately, so a sealed report can be linked without inventing a path — so
    # there is nothing legitimate under any of these five. The same defect was in
    # micro-web-template and every frontend cut from it; `site` records finding it a third time in
    # /products/pay. Found here by a browser scenario probing /battles/<id>.
    location ~ ^/worlds/aetherholm/(cities|fleets|battles|alliance|chronicle)/?$ {
        add_header Cache-Control "no-store" always;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /worlds/aetherholm/index.html =404;
    }

    # ---- the sitemap and robots.txt, composed from $host ------------------
    #
    # THEY ARE HERE RATHER THAN IN public/ FOR THE ONE REASON THAT DECIDES IT: a sitemap must carry
    # ABSOLUTE URLs — the spec requires it, and a crawler discards a relative `<loc>` — and nothing
    # built in this repository is allowed to name a hostname, because one image is served from
    # localhost, from a preview deployment and from the apex (test/no-build-time-config.test.ts).
    # nginx is the component that knows: it has `$host` on every request, so the addresses are
    # composed per request and the artefact stays environment-free.
    #
    # A FILE IN public/ WOULD BE WORSE THAN EITHER, and that is not a style point: an exact-match
    # `location =` wins over the `location /` prefix that serves the static tree, so `public/
    # robots.txt` would be built, shipped, unreachable, and edited by the next reader to no effect.
    # test/sitemap.test.ts asserts neither file exists.
    #
    # ── WHY THIS IS NOT `sitemapXml()` FROM @cloudsforge/ui ────────────────────────────────────
    #
    # THIS SURFACE IS NOT THE APEX. The shared generator composes every sibling as
    # `<subdomain>.$host`, which is exactly right on the marketing site, where `$host` IS the apex.
    # Here `$host` is already `aetherholm.<apex>`, so the same generator would emit
    # `worlds.aetherholm.<apex>` — a two-label name that resolves to nothing and fails the edge's
    # one-label wildcard certificate. A sitemap of addresses that cannot be connected to is worse
    # than no sitemap: a crawler handed dead URLs by a site's own index discounts the ones that
    # work. So this surface lists ITS OWN routes and the estate sitemap stays the apex's job.
    #
    # ── AND WHY IT LISTS TWO ROUTES OUT OF SIX ────────────────────────────────────────────────
    #
    # `/`, `/cities`, `/fleets` and `/alliance` are behind ProtectedRoute: a visitor without a
    # session is sent to hub's login, so a crawler following them is handed a redirect to a wall it
    # cannot pass. `src/lib/routes.ts` already carries `protected` on every route and the shell
    # emits `noindex, nofollow` for the same four, so this list is the exact complement of that
    # set rather than a second opinion about it — test/sitemap.test.ts checks the derivation in
    # both directions.
    #
    # `/battles?id=<uuid>` and `/chronicle`'s per-season view are DELIBERATELY absent for a
    # different reason: they are query strings on the two listed addresses, one per battle and one
    # per sealed season, minted by the service. A static list of them here would be a second
    # opinion about which battles exist, stale the moment one is fought. They are reachable from
    # the pages that list them, which is what a crawler follows.
    location = /worlds/aetherholm/sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line below is inert — a declaration that reads as a decision and is not.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of
        # the two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host/worlds/aetherholm/battles</loc></url>
  <url><loc>$scheme://$host/worlds/aetherholm/chronicle</loc></url>
</urlset>';
    }

    # ---- THERE WAS A `location = /robots.txt` HERE, AND THE FOLDER MOVED IT ------------------
    #
    # A crawler reads robots.txt at the ORIGIN ROOT and nowhere else, so `<apex>/worlds/aetherholm/robots.txt`
    # is a file nothing ever fetches — a block here could only be dead configuration that READS
    # like a policy.
    #
    # Nothing to carry: this surface disallowed nothing. Its routes are public and there is no
    # client-side search minting an address per `?q=`. The `Sitemap:` line moved to micro-site,
    # which serves the one robots.txt this origin has, and the `if ($cf_env)` refusal moved with it
    # — micro-site already had an identical one, so a testnet apex answers `Disallow: /` and covers
    # this surface by construction rather than by a second copy living where nothing reads it.

    # ---- everything else -------------------------------------------------
    # A real file (favicon, robots.txt) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /worlds/aetherholm/index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
